# A tiny catalogue with game modes for the tests (made-up arities, not game data).
schema_version = 1
game = "test"
license = "CC0-1.0"
source = "written for the gsc_check tests"

[extraction]
modes = { sp = "sp.exe", mp = "mp.exe", zm = "zm.exe" }

[[builtin]]
name = "spawnfx"
